config_version = 14

[bar]
order = [ "Top_Bar" ]

    [bar.Top_Bar]
    background_opacity = 0.4999999888241291
    capsule = true
    capsule_padding = 10.0
    center = [ "clock" ]
    end = [
        "widget",
        "media",
        "tray",
        "notifications",
        "clipboard",
        "bitwarden",
        "network",
        "bluetooth",
        "output_volume",
        "battery"
    ]
    margin_edge = 5
    margin_ends = 5
    start = [ "control-center", "wallpaper", "workspaces", "active_window" ]
    thickness = 40

[battery]
warning_threshold = 15

[brightness]
minimum_brightness = 0.01

[calendar]
enabled = true

    [calendar.account.sridhars2111]
    color = "primary"
    name = "Personal Calendar"
    type = "google"

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
auto_hide = true
enabled = true
launcher_position = "start"
pinned = [ "firefox", "com.rtosta.zapzap", "feishin" ]
reserve_space = false
show_dots = true
show_instance_count = false

[hot_corners]
delay_ms = 250
enabled = true

    [hot_corners.top_left]
    action = "command"
    command = "niri msg action toggle-overview"

    [hot_corners.top_right]
    action = "command"
    command = "noctalia msg panel-toggle session"

[location]
auto_locate = true

[lockscreen_widgets]
