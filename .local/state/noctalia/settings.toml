[nightlight]
enabled = true

[osd.kinds]
media = false

[plugin_settings."h465855hgg/lyrics"]
translation_language = "en"

[plugins]
enabled = [ "noctalia/wallpaper_depth", "yuuto/arch-updater", "elijaharch/wl-screen-mirror", "noctalia/bitwarden" ]

[shell]
font_family = "Inter"
polkit_agent = true
screen_time_enabled = true
settings_window_translucent = true
telemetry_enabled = true

    [shell.greeter_sync]
    auto_sync = true

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = false
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

[theme]
builtin = "Noctalia"
community_palette = "Oxocarbon"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "vibrant"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "kcolorscheme", "kitty", "niri", "qt" ]
    community_ids = [ "feishin", "spicetify", "pywalfox", "libreoffice", "steam", "fastfetch" ]

[wallpaper]
directory = "/home/sridhar/Pictures/Wallpapers/Desktop/Minimalist Collection"
transition_on_startup = true

    [wallpaper.automation]
    enabled = true

    [wallpaper.default]
    path = "/home/sridhar/Pictures/Wallpapers/Desktop/Minimalist Collection/gustavo-arteaga-revenge.jpg"

    [wallpaper.last]
    path = "/home/sridhar/Pictures/Wallpapers/Desktop/Minimalist Collection/gustavo-arteaga-revenge.jpg"

    [wallpaper.monitors.DP-2]
    path = "/home/sridhar/Pictures/Wallpapers/Desktop/Minimalist Collection/alena-aenami-escape.jpg"

    [wallpaper.monitors.DP-3]
    path = "/home/sridhar/Pictures/Wallpapers/Desktop/Minimalist Collection/alena-aenami-you.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/sridhar/Pictures/Wallpapers/Desktop/Minimalist Collection/gustavo-arteaga-revenge.jpg"

[widget.battery]
display_mode = "graphic"

[widget.bitwarden]
glyph = "lock"
tooltip = "Bitwarden"
type = "custom_button"

    [widget.bitwarden.actions]
    left = "panel-toggle launcher /bw"

[widget.clock]
format = "{:%-I:%M:%S %p · %a %b %-d}"
timezone = "America/Chicago"

[widget.control-center]
enabled = false

[widget.media]
art_size = 20
hide_artist = true
hide_when_no_media = true

[widget.network]
show_label = false

[widget.widget]
type = "yuuto/arch-updater:widget"

[widget.workspaces]
hide_when_empty = true
show_labels = false